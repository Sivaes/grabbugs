          $bytes = [Convert]::FromBase64String(($b64 -replace '\s', ''))
          [IO.File]::WriteAllBytes("$PWD\grab-fix.patch", $bytes)
          $hash = (Get-FileHash grab-fix.patch -Algorithm SHA256).Hash
          if ($hash -ne $env:PATCH_SHA256) { throw "Embedded patch is damaged: SHA-256 $hash, expected $env:PATCH_SHA256" }
          git apply --ignore-whitespace --check grab-fix.patch
          if ($LASTEXITCODE -ne 0) { throw "The Grab Fix patch does not apply to $env:UPSTREAM_REF." }
          git apply --ignore-whitespace grab-fix.patch
          if ($LASTEXITCODE -ne 0) { throw "git apply failed." }
          Remove-Item grab-fix.patch
          git status --short

      # ReSkate 2.x links its Spotify helper (Rust) when cargo is on the runner. CMake looks for a
      # Windows import library inside cargo's download folder while configuring, before cargo has
      # built anything, so the crates are fetched first.
      - name: Fetch the Spotify helper's crates
        shell: pwsh
        working-directory: ReSkate
        run: |
          if (Get-Command cargo -ErrorAction SilentlyContinue) {
            cargo fetch --manifest-path SpotifyHelper/Cargo.toml
            if ($LASTEXITCODE -ne 0) { throw "cargo fetch failed." }
          } else {
            Write-Host "No cargo on this runner: ReSkate builds without the Spotify device."
          }

      - name: Configure
        shell: pwsh
        working-directory: ReSkate
        run: |
          cmake --preset vs2022-x64 "-DDINGOSDK_VERSION=${{ inputs.reskate_version }}"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

      - name: Build
        shell: pwsh
        working-directory: ReSkate
        run: |
          cmake --build --preset release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      - name: Pack ReSkate.dll + ReSkateLauncher.exe
        id: pack
        shell: pwsh
        run: |
          $out = "ReSkate/build/vs2022-x64/Release"
          $files = @("ReSkate.dll", "ReSkateLauncher.exe")
          New-Item -ItemType Directory -Force -Path package | Out-Null
          foreach ($f in $files) {
            $path = Join-Path $out $f
            if (-not (Test-Path $path)) {
              $found = Get-ChildItem -Path ReSkate/build -Recurse -Filter $f | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
              if (-not $found) { throw "$f was not built." }
              $path = $found.FullName
            }
            Copy-Item $path package/
          }
          $name = "ReSkate_GrabFix-$env:GRAB_FIX_VERSION-ReSkate${{ inputs.reskate_version }}"
          Compress-Archive -Path package/* -DestinationPath "$name.zip" -Force
          Get-ChildItem package | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name }
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: package/*
          if-no-files-found: error

      - name: Publish a release
        if: ${{ inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:GRAB_FIX_VERSION"
          $notes = "Grab Fix $env:GRAB_FIX_VERSION on ReSkate ${{ inputs.reskate_version }}. Replace ReSkate.dll and ReSkateLauncher.exe in your ReSkate folder with these. Addons > GRAB FIX in the menu."
          gh release create $tag "${{ steps.pack.outputs.name }}.zip" --repo "${{ github.repository }}" --title "Grab Fix $env:GRAB_FIX_VERSION" --notes $notes
