# Grab Fix: builds ReSkate (Dingo-Shenanigans/ReSkate) with the Grab Fix patch applied and packs
# just the two files people copy over their ReSkate folder: ReSkate.dll and ReSkateLauncher.exe.
# The patch is embedded below, so this one file is the whole repo's build.
#
# Grab Fix 0.1.2 on ReSkate 2.1.1:
#   - Grab Fix (Addons > GRAB FIX, console "grabfix on|off"): the game's legacy footplants kept on,
#     which fixes Sticky Grab (A/X modified grabs held until landing).
#   - Grab probe ("grabfix probe on|off"): logs\grab-probe-*.csv, every air, and (0.1.1)
#     logs\grab-snap-*.bin, copies of the skater's objects at presses, takeoffs, bails and resets,
#     for finding the state Grab Swap keeps; 0.1.2 also copies the objects the trick state points at.
name: Build Grab Fix

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: ReSkate tag to build on
        default: v2.1.1
        required: true
      reskate_version:
        description: Version stamped into the binaries (the ReSkate release it is built on)
        default: 2.1.1
        required: true
      release:
        description: Also publish a GitHub release with the zip
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRAB_FIX_VERSION: 0.1.2
  PATCH_SHA256: B3A1C2A39CA122A92AF107265AC6D43E528939BFCAA4A0FA1873BC45C71572BA

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Get ReSkate ${{ inputs.upstream_ref }}
        uses: actions/checkout@v4
        with:
          repository: Dingo-Shenanigans/ReSkate
          ref: ${{ inputs.upstream_ref }}
          path: ReSkate

      # No GitHub expression (dollar sign + double braces) may appear in this step's run block: GitHub would evaluate the whole
      # block (the embedded patch) as one expression, which is capped at 21000 characters.
      - name: Apply the Grab Fix patch
